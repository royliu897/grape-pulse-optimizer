[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grape-pulse-optimizer"
version = "0.1.0"
description = "GRAPE pulse optimization and hardware-distortion correction experiments for neutral-atom control."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Roy Liu"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "PyYAML>=6,<7",
]

[tool.setuptools]
py-modules = ["run_grape"]

[tool.setuptools.packages.find]
where = ["."]
include = ["grape*", "hardware*", "physics*"]

