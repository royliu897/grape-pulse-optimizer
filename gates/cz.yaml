gate_name: "cz_gate"
gate_type: "two_qubit"
description: "CZ gate via Rydberg blockade"
target: "CZ"
subspaces: ["00", "01", "11"]
N_timesteps: 250
gate_duration_us: 3.0

optimizer:
  method: "lbfgs"
  max_iter: 1000
  tol: 1.0e-8
  n_starts: 4

init:
  Omega_mean: 1.6
  Omega_std: 0.2
  phi_mean: 0.0
  phi_std: 0.5

regularization:
  alpha: 0.0
  beta:  0.05
  gamma: 0.05

basinhopping:
  n_iter:   50
  T:        0.15
  stepsize: 0.4

hardware_correction:
  enabled: true
  n_iter: 400
  learning_rate: 0.03
